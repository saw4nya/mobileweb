<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 06 - Expense Tracker App</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: linear-gradient(135deg, #4f8cff, #6a5cff);
            --primary-solid: #4f8cff;
            --bg: #f2f4f8;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1f2937;
            --text-sub: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Kanit", sans-serif;
        }

        body {
            background: var(--bg);
            padding: 40px 16px;
            color: var(--text-main);
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 36px 40px 46px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 2.1rem;
            background: var(--primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .home-button {
            padding: 10px 22px;
            border-radius: 999px;
            background: #e8edff;
            color: var(--primary-solid);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .home-button:hover {
            background: var(--primary-solid);
            color: white;
            box-shadow: 0 8px 20px rgba(79, 140, 255, 0.35);
            transform: translateY(-2px);
        }

        .student-info {
            margin-top: 8px;
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        h2 {
            margin-top: 50px;
            margin-bottom: 20px;
            font-size: 1.6rem;
        }

        /* Images */
        .image-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        .screenshot {
            width: 100%;
            max-width: 320px;
            border-radius: 10px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .screenshot:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        /* Download Button */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 50px;
            padding: 18px 36px;
            border-radius: 999px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 500;
            box-shadow: 0 12px 30px rgba(79, 140, 255, 0.4);
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 40px rgba(79, 140, 255, 0.55);
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .home-button {
                align-self: flex-end;
            }

            .header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Ionic + Firebase Expense Tracker App</h1>
            <a href="../index.html" class="home-button">← กลับหน้าแรก</a>
        </div>
        <p class="student-info">โดย ศวรรยา ศิริมูล รหัส 663380238-0</p>
        <br>
        <hr>

        <h2>ตัวอย่างการใช้งานหน้าจอ</h2>
        <div class="image-wrapper">
            <h3>เพิ่มรายการบันทึกรายรับ-รายจ่าย</h3>
            <img src="public/add.png" alt="หน้าจอ App" class="screenshot">
            <h3>แสดงรายการ</h3>
            <img src="public/show.png" alt="หน้าจอ App" class="screenshot">
            <h3>แก้ไขรายการ</h3>
            <img src="public/edit.png" alt="หน้าจอ App" class="screenshot">
            <h3>ลบรายการ</h3>
            <img src="public/delete.png" alt="หน้าจอ App" class="screenshot">
        </div>


    </div>

</body>

</html>
